services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbom
      POSTGRES_PASSWORD: sbom
      POSTGRES_DB: sbom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbom"]
      interval: 5s
      timeout: 5s
      retries: 10
